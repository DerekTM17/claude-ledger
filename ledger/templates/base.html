<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledger{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23010509'/%3E%3Cpath d='M10 8v16h13' stroke='%235cc8ff' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ static_url(request, 'style.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/">LEDGER<small>What each project finished, and what's next</small></a>
      <form class="search" action="/search" method="get" role="search">
        <label for="q">Search all projects</label>
        <input id="q" name="q" type="search" value="{{ q | default('', true) }}"
               placeholder="Try “domain” or “feedback form”" autocomplete="off" required>
      </form>
    </header>
    {% block content %}{% endblock %}
    <footer class="foot">{% block footer %}{% endblock %}</footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
